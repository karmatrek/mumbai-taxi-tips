<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#075e54">
<title>मुंबई ड्राइवर टिप्स</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans Devanagari',sans-serif;background:#111;min-height:100vh;padding:12px;}
.wrap{max-width:480px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;}

/* Header */
.header{background:#075e54;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.hicon{width:44px;height:44px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.htitle{font-size:17px;font-weight:600;color:#fff;}
.hsub{font-size:11px;color:#a8d5b5;margin-top:1px;}
.refresh-btn{margin-left:auto;background:rgba(255,255,255,0.15);border:none;border-radius:8px;padding:6px 10px;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;}
.refresh-btn:active{background:rgba(255,255,255,0.25);}

/* Date bar */
.datebar{background:#f0f9f4;border-left:4px solid #25d366;padding:10px 14px;}
.datebar-day{font-size:11px;color:#666;}
.datebar-main{font-size:14px;font-weight:600;color:#111;margin-top:2px;}

/* Loading */
.loading{padding:40px 20px;text-align:center;}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#25d366;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{font-size:13px;color:#888;}

/* Error */
.error{padding:24px 16px;text-align:center;}
.error p{font-size:13px;color:#c0392b;margin-bottom:12px;}
.retry-btn{background:#25d366;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;font-family:inherit;}

/* Cards */
.cards{padding:12px 12px 0;}
.card{border:1px solid #e8e8e8;border-radius:12px;padding:12px 13px;margin-bottom:10px;background:#fafafa;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
.card-name{font-size:14px;font-weight:600;color:#111;flex:1;line-height:1.4;}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;font-weight:500;}
.venue{font-size:11px;color:#999;margin-bottom:8px;}
.row{font-size:13px;color:#333;line-height:2.1;}
.green{color:#1a7a46;font-weight:500;}
.warn{font-size:11px;color:#c0392b;margin-top:4px;}
.score-bar{height:3px;background:#eee;border-radius:2px;margin-top:10px;}
.score-fill{height:3px;border-radius:2px;background:linear-gradient(90deg,#25d366,#075e54);}

/* Source tag */
.src-tag{font-size:9px;color:#bbb;margin-top:6px;}

/* Tomorrow tip */
.tip-box{margin:0 12px 10px;background:#fffbf0;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;display:flex;gap:8px;}
.tip-label{font-size:12px;font-weight:500;color:#92400e;}
.tip-body{font-size:11px;color:#666;margin-top:2px;line-height:1.6;}

/* Reply bubble */
.reply{margin:0 12px 12px;background:#dcf8c6;border-radius:4px 12px 12px 12px;padding:10px 13px;max-width:90%;}
.reply-text{font-size:12px;color:#111;line-height:1.9;}
.reply-time{font-size:10px;color:#888;text-align:right;margin-top:4px;}

/* Footer */
.footer{border-top:1px solid #f0f0f0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
.footer-left{font-size:11px;color:#999;}
.footer-right{font-size:11px;color:#25d366;font-weight:500;}

/* Share button */
.share-wrap{padding:10px 12px 14px;text-align:center;}
.share-btn{width:100%;background:#25d366;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:0.3px;}
.share-btn:active{background:#1da554;}

/* Belt badge */
.belt{font-size:9px;padding:2px 6px;border-radius:8px;margin-left:6px;vertical-align:middle;}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="hicon">🚖</div>
    <div>
      <div class="htitle">मुंबई ड्राइवर टिप्स</div>
      <div class="hsub">आज की सबसे अच्छी जगह</div>
    </div>
    <button class="refresh-btn" onclick="loadTips()">↻ रिफ्रेश</button>
  </div>

  <div class="datebar">
    <div class="datebar-day" id="date-day">लोड हो रहा है...</div>
    <div class="datebar-main" id="date-main"></div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>आज के इवेंट खोज रहे हैं...</p>
    </div>
  </div>
</div>

<script>
const DAY_NAMES   = ["रविवार","सोमवार","मंगलवार","बुधवार","गुरुवार","शुक्रवार","शनिवार"];
const MONTH_NAMES = ["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];

const TYPE_BADGE = {
  wedding:    ["#fff3cd","#856404","देर रात 🌙"],
  concert:    ["#d1ecf1","#0c5460","शाम को 🎵"],
  sports:     ["#d1ecf1","#0c5460","शाम को 🏏"],
  flight:     ["#f8d7da","#721c24","रात 2–5 बजे ✈"],
  exhibition: ["#eeedfe","#3c3489","दोपहर 🎨"],
  comedy:     ["#eaf3de","#27500a","शाम को 😄"],
  other:      ["#f1efe8","#5f5e5a","आज"],
};
const HOUR_LABEL = {
  wedding:    "रात 11:30 – 1:30 बजे",
  concert:    "शो खत्म 10:00–10:30 बजे",
  sports:     "मैच खत्म होने पर",
  flight:     "रात 1–5 बजे",
  exhibition: "शाम 6–9 बजे",
  comedy:     "शो खत्म 10 बजे",
  other:      "शाम 6–10 बजे",
};
const SOURCE_LABEL = {
  insider:"insider.in", bookmyshow:"BookMyShow",
  toi:"Mumbai Mirror", csia:"CSIA", default:"एयरपोर्ट डिफ़ॉल्ट",
  pattern:"वेन्यू पैटर्न"
};

function setDate() {
  const d = new Date();
  document.getElementById("date-day").textContent =
    `${DAY_NAMES[d.getDay()]} · ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  document.getElementById("date-main").textContent =
    "आज मुंबई में टॉप इवेंट्स और फ्लाइट्स";
}

function renderCards(tips) {
  if (!tips || tips.length === 0) {
    document.getElementById("content").innerHTML =
      `<div class="error"><p>आज कोई इवेंट नहीं मिला</p><button class="retry-btn" onclick="loadTips()">फिर कोशिश करो</button></div>`;
    return;
  }

  const maxScore = Math.max(...tips.map(t => t.score));

  const cards = tips.map(tip => {
    const [bbg, bfg, btxt] = TYPE_BADGE[tip.type] || TYPE_BADGE.other;
    const hourTxt  = HOUR_LABEL[tip.type] || HOUR_LABEL.other;
    const warnHtml = tip.zone.traffic_warn
      ? `<div class="warn">⚠ ${tip.zone.traffic_warn}</div>` : "";
    const scoreW   = Math.round((tip.score / maxScore) * 100);
    const srcLabel = SOURCE_LABEL[tip.source] || tip.source;

    return `
    <div class="card">
      <div class="card-top">
        <div class="card-name">${tip.name}</div>
        <span class="badge" style="background:${bbg};color:${bfg};">${btxt}</span>
      </div>
      <div class="venue">${tip.venue}</div>
      <div class="row">⏰ ${hourTxt}</div>
      <div class="row">📍 ${tip.zone.wait_hindi}</div>
      <div class="row green">✅ ${tip.zone.tip_hindi}</div>
      ${warnHtml}
      <div class="score-bar"><div class="score-fill" style="width:${scoreW}%"></div></div>
      <div class="src-tag">स्रोत: ${srcLabel}</div>
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="cards">${cards}</div>
    <div class="tip-box">
      <span style="font-size:16px;">💡</span>
      <div>
        <div class="tip-label">कल का इशारा</div>
        <div class="tip-body">फ्लाइट टाइम और लोकल इवेंट कल शाम ज़रूर चेक करो — एयरपोर्ट हमेशा सेफ बेट है।</div>
      </div>
    </div>
    <div class="reply">
      <div class="reply-text">भाई कल की टिप एकदम सही निकली 👍<br>10:15 बजे गया, सीधे 3 सवारी मिली।<br>आज भी ट्राय करता हूँ</div>
      <div class="reply-time">11:42 PM ✓✓</div>
    </div>
    <div class="share-wrap">
      <button class="share-btn" onclick="shareApp()">📤 ग्रुप में शेयर करो</button>
    </div>
    <div class="footer">
      <div class="footer-left">अपने ड्राइवर दोस्तों को भेजो 🙏</div>
      <div class="footer-right">मुंबई ड्राइवर टिप्स</div>
    </div>`;
}

async function loadTips() {
  document.getElementById("content").innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <p>आज के इवेंट खोज रहे हैं...</p>
    </div>`;
  try {
    const res  = await fetch("/.netlify/functions/get-tips");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderCards(data.tips);
  } catch (e) {
    document.getElementById("content").innerHTML = `
      <div class="error">
        <p>इवेंट लोड नहीं हुए: ${e.message}</p>
        <button class="retry-btn" onclick="loadTips()">फिर कोशिश करो</button>
      </div>`;
  }
}

function shareApp() {
  const url  = window.location.href;
  const text = "🚖 मुंबई ड्राइवर टिप्स — आज की सबसे अच्छी जगह देखो:\n" + url;
  if (navigator.share) {
    navigator.share({ title:"मुंबई ड्राइवर टिप्स", text, url })
      .catch(() => copyToClipboard(url));
  } else {
    copyToClipboard(text);
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text)
    .then(() => alert("लिंक कॉपी हो गया! WhatsApp पर पेस्ट करो"))
    .catch(() => alert("लिंक कॉपी करो: " + window.location.href));
}

setDate();
loadTips();
</script>
</body>
</html>
